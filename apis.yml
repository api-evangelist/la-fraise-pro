aid: la-fraise-pro
name: La Fraise Pro
description: >-
  La Fraise (LA FRAISE PRO SAS) is a French SaaS platform that digitizes the
  administrative patient journey for dental practices and dental centers:
  interactive treatment quotes (devis), patient-education video, informed
  consent, mutual-insurer coverage requests, and compliant electronic signature,
  all handled remotely. The product integrates natively with the French dental
  practice-management market — LOGOSw, Julie, Veasy, CS Trophy, Visiodent,
  Ardion, WeClever, Desmos, Galaxie and Effigie — with real-time bidirectional
  sync for LOGOSw, Veasy and Desmos. More than 3,500 dentists are equipped.
  Patient data is hosted on HDS-certified AWS infrastructure in the European
  Union, in line with article L.1111-8 of the French Code de la sante publique,
  and electronic signature follows Agence du Numerique en Sante (ANS) norms.
  La Fraise publishes no public developer API; practice-management integrations
  are provisioned by its own technical team.
